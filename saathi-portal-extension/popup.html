<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <div>
      <div class="title">Saathi AI Portal Helper</div>
      <div style="font-size: 11px; color: #94a3b8;" id="active-ref">No active complaint</div>
    </div>
  </div>

  <div class="card" id="card-details">
    <div style="margin-bottom: 4px;"><strong>Target:</strong> cybercrime.gov.in</div>
    <div style="margin-bottom: 4px;" id="detail-amount">Amount: —</div>
    <div style="margin-bottom: 4px;" id="detail-bank">Entity: —</div>
    <div id="detail-suspect">Suspect: —</div>
  </div>

  <button class="btn" id="btn-autofill-now">⚡ Auto-Fill Active Portal Tab</button>
  <a class="btn btn-secondary" href="https://cybercrime.gov.in/login-terms-conditions" target="_blank">Open cybercrime.gov.in ↗</a>

  <script src="popup.js"></script>
</body>
</html>
